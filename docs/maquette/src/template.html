<title>Calipso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout : bandeau "mer" en tête avec la grande question, puis une colonne de travail + une colonne "mon activité". Portail de service public : lisibilité d'abord. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e8eeed; --ink:#11303c; --muted:#4f6b75; --line:#d5e0e0;
  --accent:#0a6f6b; --accent-soft:#dcefed; --on-accent:#ffffff;
  --hero:#0f3a48; --hero-ink:#eaf5f3; --hero-muted:#a9c8c9;
  --prob:#b4431a; --prob-soft:#fbe7dd; --ok:#2f7a3a; --ok-soft:#e1f1e2; --wait:#8a5a00; --wait-soft:#fbefd2;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c181d; --surface:#122329; --sunk:#0f1e23; --ink:#e2eef0; --muted:#94afb6; --line:#24404a;
  --accent:#43b8ad; --accent-soft:#163a3b; --on-accent:#06201f;
  --hero:#0a2a34; --hero-ink:#e6f4f2; --hero-muted:#8fb4b6;
  --prob:#f08a5d; --prob-soft:#3a2117; --ok:#6cc27a; --ok-soft:#173022; --wait:#e2b350; --wait-soft:#33290f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c181d; --surface:#122329; --sunk:#0f1e23; --ink:#e2eef0; --muted:#94afb6; --line:#24404a;
  --accent:#43b8ad; --accent-soft:#163a3b; --on-accent:#06201f;
  --hero:#0a2a34; --hero-ink:#e6f4f2; --hero-muted:#8fb4b6;
  --prob:#f08a5d; --prob-soft:#3a2117; --ok:#6cc27a; --ok-soft:#173022; --wait:#e2b350; --wait-soft:#33290f;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.count{font-size:12px;background:var(--sunk);color:var(--ink);border-radius:20px;padding:0 7px;font-variant-numeric:tabular-nums}
.me{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.dsn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.dsn input{accent-color:var(--accent);width:16px;height:16px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
.hero .wrap{padding-block:40px 34px;position:relative;z-index:1}
.hero h1{font-size:clamp(28px,4.2vw,44px);font-weight:700;letter-spacing:-.02em;max-width:22ch}
.hero p.lead{color:var(--hero-muted);margin:10px 0 22px;max-width:60ch}
.hero svg.waves{position:absolute;right:-40px;bottom:-50px;width:560px;max-width:70%;opacity:.35;pointer-events:none}
.search{display:flex;background:var(--surface);border-radius:14px;padding:6px;gap:6px;max-width:820px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 14px;font-size:19px;color:var(--ink);outline:none}
.search button{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:0 20px;font-weight:700;cursor:pointer}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.examples span{font-size:14px;color:var(--hero-muted);margin-right:4px}
.chip{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:var(--hero-ink);border-radius:20px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.16)}

/* main grid */
main .wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding-block:28px 40px}
main .wrap.single{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){main .wrap{grid-template-columns:minmax(0,1fr)}}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.sec-title h2{font-size:22px}
.sec-title small{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* situations */
.situations{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sit{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s, transform .15s}
.sit:hover{border-color:var(--accent);transform:translateY(-1px)}
.sit .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sit strong{display:block;font-size:16px;line-height:1.25}
.sit small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.sit.prob{grid-column:1/-1;background:var(--prob-soft);border-color:transparent}
.sit.prob .ic{background:var(--prob);color:var(--surface)}
.sit.prob strong{font-size:19px;font-family:var(--f-display)}
.sit.prob:hover{border-color:var(--prob)}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* aside */
aside{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:16px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.kv b{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:18px}
.kv a{text-decoration:none;color:var(--ink)}
.fav{display:flex;flex-direction:column;gap:2px}
.fav button{text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:15px}
.fav button:hover{background:var(--sunk)}
.hotline{background:var(--sunk);border:0}
.hotline .num{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;user-select:all}
.hotline p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* results */
.clarify{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.clarify p{margin:0;flex:1 1 260px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.group{margin-bottom:24px}
.group h3{font-size:15px;color:var(--muted);font-family:var(--f-body);font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.dot.p{background:var(--prob)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .t{flex:1;min-width:0}
.row .t strong{display:block;font-weight:700}
.row .t small{display:block;color:var(--muted);font-size:14px}
.row .go{color:var(--muted);flex:none}
.row.static{cursor:default}
.row.static:hover{background:transparent}
.acts{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.big{padding:12px 22px;font-size:16px}
.tag{display:none;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:4px;word-break:break-word}
.tag i{font-style:normal;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:6px}
.tag i.inc{background:var(--prob-soft);color:var(--prob)}
.tag i.dem{background:var(--accent-soft);color:var(--accent)}
body.show-logic .tag{display:block}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* forms */
.crumb{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:700}
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:22px}
.formcard h1{font-size:clamp(24px,3vw,32px)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:700}
.field .help{font-size:14px;color:var(--muted)}
.input,textarea.input,select.input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%}
textarea.input{min-height:120px;resize:vertical}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.choice{position:relative}
.choice input{position:absolute;opacity:0}
.choice label{display:block;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;height:100%}
.choice label b{display:block}
.choice label small{color:var(--muted);font-size:14px}
.choice input:checked+label{border-color:var(--accent);background:var(--accent-soft)}
.choice input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.picked{display:flex;align-items:center;gap:12px;background:var(--prob-soft);border-radius:10px;padding:12px 14px}
.picked.dem{background:var(--accent-soft)}
.picked .t{flex:1;min-width:0}
.picked small{display:block;color:var(--muted);font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fchip .count{margin-left:4px}
.scroller{max-height:420px;overflow:auto}
.note{background:var(--wait-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:15px}
.note b{color:var(--wait)}
.tips{background:var(--sunk);border-radius:10px;padding:14px 16px}
.tips ul{margin:6px 0 0;padding-left:20px}
.summary{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:8px;padding:10px 12px;display:none}
body.show-logic .summary{display:block}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px}
.meta b{color:var(--ink)}
.actions-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);padding-top:18px}
.done{text-align:center;padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:12px}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.done .tick svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.4}
.ticket{font-family:var(--f-mono);font-size:18px;background:var(--sunk);padding:4px 12px;border-radius:6px;user-select:all}

/* tickets */
.tk{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:6px 16px;align-items:center}
@media (max-width:640px){.tk{grid-template-columns:minmax(0,1fr) auto}.tk .num{grid-column:1/-1}}
.tk .num{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pill{font-size:13px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.run{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.kind{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kind.p{color:var(--prob)} .kind.d{color:var(--accent)}
.steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:18px 1fr;gap:12px;padding-bottom:14px;position:relative}
.steps li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:5px}
.steps li.on::before{background:var(--accent);border-color:var(--accent)}
.steps li.cur::before{border-color:var(--accent)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:7px;top:20px;bottom:0;width:2px;background:var(--line)}
.steps small{color:var(--muted);display:block}

/* logic page */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.bigstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.bigstats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.bigstats b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.bigstats small{color:var(--muted)}
.prose{max-width:70ch}
.prose p{margin:0 0 12px}

footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{display:flex;flex-wrap:wrap;gap:6px 22px;padding-block:18px;font-size:14px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--accent)}
footer .proto{margin-left:auto;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:760px){.top .wrap{gap:8px 14px;padding-block:8px}.nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.nav a{white-space:nowrap}.brand{flex:1}.search input{font-size:17px}.search button{padding:0 14px}.me .name{display:none}.hero .wrap{padding-block:28px 26px}}
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#accueil"><b>Calipso</b><span>Côtes d'Armor · DSN</span></a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#accueil" data-nav="accueil">Accueil</a>
      <a href="#mes-demandes" data-nav="mes-demandes">Mes demandes <span class="count">44</span></a>

      <a href="#logique" data-nav="logique">Comment ça marche</a>
    </nav>
    <label class="dsn" title="Affiche, sur chaque résultat, le sujet d'incident ou le service EasyVista qui sera créé"><input type="checkbox" id="logicToggle"> Vue DSN</label>
    <div class="me"><span class="avatar">NC</span><span class="name">CARDON Nicolas</span></div>
  </div>
</header>

<div id="app"></div>

<footer>
  <div class="wrap">
    <a href="#accueil">Annuaire interne</a><a href="#accueil">Annuaire externe</a><a href="#accueil">Annuaire encadrant</a><a href="#accueil">Annuaire référent SI</a><a href="#accueil">Mes services</a><a href="#accueil">Mes équipements</a><a href="#accueil">Mentions légales</a>
    <span class="proto">Prototype · aucune demande n'est réellement envoyée</span>
  </div>
</footer>

<script>
const DATA = __DATA__;

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9@]+/g,' ').trim();
const ICONS = {
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  euro:'<path d="M18 6a7 7 0 1 0 0 12"/><path d="M4 10h10M4 14h10"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  cube:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
  arrow:'<path d="M9 6l6 6-6 6"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
const icon = (n, cls='') => `<svg viewBox="0 0 24 24" aria-hidden="true" class="${cls}">${ICONS[n]}</svg>`;
const arrow = `<span class="go"><span class="ic">${icon('arrow')}</span></span>`;
const incPath = o => ['Incidents/IT',o.p,o.n].filter(Boolean).join('/');
const humanPath = p => p.replace(/^Equipement (de proximité|central)\/?/,'').replace(/^Logiciel\/?/,'Application ').replace(/\//g,' › ').trim();
const FAM = {
  mat:{l:'Matériel informatique et téléphonie', s:'Ordinateur, écran, téléphone, accessoires, prêt de matériel', i:'laptop'},
  log:{l:'Installer un logiciel', s:'Retouche d\'image, CAO, cartographie, PDF…', i:'cube'},
  resa:{l:'Réserver une salle, un véhicule, du matériel', s:'Salles de réunion, bureaux d\'entretien, véhicules, vidéoprojecteurs', i:'cal'},

function scoreItem(tokens, w){
  let s=0;
  for(const t of tokens){
    let best=0;
    for(const x of w){
      if(x===t){best=3;break}
      if(t.length>=3 && x.startsWith(t)) best=Math.max(best,2);
      else if(t.length>=4 && x.includes(t)) best=Math.max(best,1);
    }
    s+=best;
  }
  return s;
}
function search(q){
  const n=' '+norm(q)+' ';
  const isProb=PROB.test(n), isNeed=NEED.test(n.replace(/(plus|pas|jamais) acces a/g,''));
  const cur={i:new Map(),s:new Map(),a:new Map(),f:new Map(),at:new Map()};
  const add=(kind,key,obj,score)=>{const m=cur[kind];const p=m.get(key);if(!p||p.score<score)m.set(key,{obj,score})};
  // 1. dictionnaire de besoins : les mots reconnus sont "consommés"
  let rest=n;
  SYN.forEach(e=>{
    const keys=e.k.filter(k=>n.includes(' '+k));
    if(!keys.length) return;
    keys.forEach(k=>{rest=rest.replace(new RegExp(' '+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*','g'),' ')});
    e.r.forEach((ref,ix)=>{
      const t=ref[0], v=ref.slice(2); const sc=20-ix+(e.p||0);
      if(t==='i'&&incBy[v]) add('i',v,incBy[v],sc);
      if(t==='s'&&svcBy[v]) add('s',v,svcBy[v],sc);
      if(t==='f') add('f',v,v,sc);
      if(t==='a') add('at',v,v,sc);
    });
  });
  const tokens=rest.trim().split(' ').filter(t=>t && !STOP.has(t) && t.length>1 && !/^(acces|acceder|dossier|partage|boite|espace|application|appli|logiciel)$/.test(t));
  // 2. correspondance sur les libellés du catalogue
  let accStrong=false;
  if(tokens.length){
    const need=Math.max(2,tokens.length*1.5), full=3*tokens.length;
    const bonus=s=>s>=full?25:s;
    if(!(isNeed&&!isProb)) IDX.inc.forEach(({o,w})=>{const s=scoreItem(tokens,w); if(s>=need||(s>=3&&tokens.length<=2)) add('i',o.n,o,bonus(s))});
    IDX.svc.forEach(({o,w})=>{const s=scoreItem(tokens,w); if(s>=need) add('s',o.t,o,bonus(s))});
    IDX.acc.forEach(({o,w})=>{const s=scoreItem(tokens,w); if(s>=3||(s>=2&&tokens.length===1)){add('a',o.r,o,bonus(s)); if(s>=3) accStrong=true}});
  }
  const top=(m,k)=>[...m.values()].sort((a,b)=>b.score-a.score).slice(0,k).map(x=>x.obj);
  const r={q, isProb, isNeed, inc:top(cur.i,5), svc:top(cur.s,7), acc:top(cur.a,6), fam:top(cur.f,2), atype:top(cur.at,2)};
  r.svcExact = r.svc.length>0 && (cur.s.get(r.svc[0].t)||{}).score>=25;
  r.accFirst = accStrong && !r.svc.some(s=>(cur.s.get(s.t)||{}).score>=25);
  r.mode = isProb && !isNeed ? 'p' : (!isProb && isNeed ? 'd' : (r.inc.length && !(r.svc.length+r.acc.length+r.fam.length+r.atype.length) ? 'p' : null));
  return r;
}

    <div class="bigstats"><div><b>1</b><small>Approbation à donner</small></div><div><b>11</b><small>Mes actions</small></div><div><b>20</b><small>Actions de mes groupes</small></div><div><b>0</b><small>Clôtures à confirmer</small></div></div>
    <p class="help" style="margin-top:16px">Ces quatre entrées occupaient la moitié de la barre de navigation actuelle alors qu'elles ne concernent qu'une partie des agents. Elles sont regroupées ici et n'apparaissent que si l'agent a des éléments à traiter.</p>`);
}

/* ---- comment ça marche (vue DSN) ---- */
function viewLogique(){
  setNav('logique');
  const ex=['Mon imprimante n\'imprime plus','J\'ai besoin d\'une imprimante','Un stagiaire arrive lundi','Je n\'ai plus accès à GECO','Accès au dossier Q: DRHQVT','Excel plante à l\'ouverture','Mon écran reste noir','Réserver la Clio','J\'ai reçu un mail suspect','Mot de passe oublié'];
  const firstOf=r=>{const D=()=>r.svcExact?`DEMANDE · ${r.svc[0].t}`:r.accFirst&&r.acc[0]?`DEMANDE · ${ACT[1].t(r.acc[0].r)}`:r.atype[0]?`Parcours accès · ${ATYPE[r.atype[0]]}`:r.fam[0]?`Rubrique · ${FAM[r.fam[0]].l}`:r.svc[0]?`DEMANDE · ${r.svc[0].t}`:r.acc[0]?`DEMANDE · ${ACT[1].t(r.acc[0].r)}`:null;
    const P=()=>r.inc[0]?`INCIDENT · ${incPath(r.inc[0])}`:null;
    return (r.mode==='d'?(D()||P()):(P()||D()))||'Demande libre';};
  const rows=ex.map(q=>{const r=search(q);const mode=r.mode==='p'?'Problème':r.mode==='d'?'Besoin':'Question posée à l\'agent';
    return `<tr><td>${esc(q)}</td><td>${mode}</td><td style="font-family:var(--f-mono);font-size:12.5px">${esc(firstOf(r))}</td></tr>`}).join('');
  app.innerHTML=shell(`<div class="prose"><div class="eyebrow">Vue DSN</div><h2 style="font-size:28px;margin:4px 0 14px">Comment Calipso oriente les agents</h2>
    <p>L'agent décrit sa situation. Trois mécanismes décident du formulaire proposé, sans jamais lui demander de choisir entre incident et demande&nbsp;:</p>
    <p><b>1. Le dictionnaire de besoins.</b> ${SYN.length} groupes de formulations courantes («&nbsp;imprimante&nbsp;», «&nbsp;stagiaire&nbsp;», «&nbsp;mail suspect&nbsp;»…) pointent vers des sujets d'incident et des services précis. C'est la pièce à enrichir avec les intitulés de vos tickets réels.</p>
    <p><b>2. Le ton de la phrase.</b> «&nbsp;ne marche plus&nbsp;», «&nbsp;bloqué&nbsp;», «&nbsp;erreur&nbsp;» mettent les problèmes en tête&nbsp;; «&nbsp;besoin&nbsp;», «&nbsp;nouveau&nbsp;», «&nbsp;réserver&nbsp;» mettent les demandes en tête. Si la phrase est ambiguë, une question simple est posée.</p>
    <p><b>3. Les libellés du catalogue.</b> Le nom d'une application (GECO, ASTRE RH, Teams…) fait remonter à la fois «&nbsp;ça ne fonctionne pas&nbsp;» et «&nbsp;obtenir un accès&nbsp;».</p></div>
    <div class="bigstats" style="margin:20px 0"><div><b>${DATA.inc.length}</b><small>sujets d'incident</small></div><div><b>${DATA.svc.length}</b><small>services hors accès</small></div><div><b>2 958</b><small>entrées d'accès regroupées</small></div><div><b>${DATA.acc.length}</b><small>ressources dans un seul parcours</small></div></div>
    <h3 style="margin:24px 0 10px">Test sur des phrases d'agents</h3>
    <div class="tablewrap"><table><thead><tr><th>Ce que tape l'agent</th><th>Lecture</th><th>Premier résultat proposé</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="help">Cochez «&nbsp;Vue DSN&nbsp;» en haut pour voir, sur chaque résultat et chaque formulaire, ce qui sera créé dans EasyVista.</p>`);
}

/* ---------- routeur ---------- */
const ROUTES={accueil:viewHome,'mes-demandes':viewMesDemandes,'a-traiter':viewATraiter,logique:viewLogique,signaler:viewSignaler,demande:viewDemande,catalogue:viewCatalogue,acces:viewAcces,envoye:viewEnvoye};
function go(v){ if(location.hash==='#'+v) route(); else location.hash=v; }
function route(){const v=(location.hash||'#accueil').slice(1);(ROUTES[v]||viewHome)();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
const lt=$('#logicToggle');
try{ if(localStorage.getItem('calipso-dsn')==='1'){lt.checked=true;document.body.classList.add('show-logic')} }catch(e){}
lt.onchange=()=>{document.body.classList.toggle('show-logic',lt.checked);try{localStorage.setItem('calipso-dsn',lt.checked?'1':'0')}catch(e){}};
route();
</script>
