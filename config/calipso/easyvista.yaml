# Correspondance avec EasyVista Service Manager (API REST v1).
# Les points marqués « À VÉRIFIER » dépendent du paramétrage de votre instance.
parameters:
    calipso.easyvista:
        # Langue des libellés du catalogue (suffixe des champs TITLE_xx / SD_CATALOG_PATH_xx)
        langue: "%env(EASYVISTA_LANG)%"

        # Code catalogue du « Sujet par défaut » des incidents (signalement sans sujet précis). À VÉRIFIER
        code_incident_defaut: "%env(default::EASYVISTA_DEFAULT_INCIDENT_CODE)%"
        # Code catalogue de la « Demande générique ». À VÉRIFIER
        code_demande_generique: "%env(default::EASYVISTA_GENERIC_REQUEST_CODE)%"
        # Champs de la fiche agent (GET /employees) comparés au login Windows, essayés dans l'ordre.
        # Exemples : login, identification, e_mail. À VÉRIFIER : comparer avec une fiche agent dans Postman.
        champs_identifiant: [login]

        # Préfixe du chemin des sujets d'incident dans le catalogue
        prefixe_incidents: "Incidents/IT"

        # Gêne exprimée par l'agent -> Urgency_ID EasyVista (voir GET /urgencies). À VÉRIFIER
        urgences:
            bloquant: 1
            gene: 2
            attente: 3

        # Lance le workflow dès la création (paramètre workflow_start)
        lancer_workflow: true
        # Envoie aussi Requestor_Mail / Requestor_Name (sinon le demandeur est le compte de l'API). À VÉRIFIER
        envoyer_demandeur: true

        # Filtre de « Mes demandes » (paramètre search de GET /requests).
        # Variables : {employee_id}, {email}, {login}. À VÉRIFIER
        recherche_mes_demandes: 'requestor.e_mail:"{email}"'
        nb_max_mes_demandes: 100

        # Historique du panneau de détail (GET /actions)
        # Filtre des actions d'une demande. Variables : {request_id}, {rfc}. À VÉRIFIER
        recherche_actions: 'request_id:{request_id}'
        # Champs demandés (vide = champs par défaut d'EasyVista ; en cas de refus, nouvel essai sans)
        champs_actions: 'action_id,action_label_fr,action_type.name_fr,creation_date_ut,start_date_ut,end_date_ut,done_by.last_name,done_by.employee_id,comment,resolution'
        # Type ou libellé d'action -> catégorie affichée (icône, couleur). Expressions régulières sans accents,
        # testées dans l'ordre ; tout le reste est une « intervention ».
        types_actions:
            validation: "valid|approb"
            resolution: "resol|solution"
            cloture: "clotur|ferme|livr"
            affectation: "affect|transf|escalad"
            prise_en_compte: "prise en (compte|charge)|qualif|enregistr|ouverture"
            message: "comment|message|echange|information|relance|reponse|mail"

        # Lien « Ouvrir dans EasyVista » du panneau ({rfc} = numéro). Vide = bouton masqué.
        lien_ticket: "%env(default::EASYVISTA_TICKET_URL)%"

        # Type d'action EasyVista utilisé pour « Écrire aux intervenants » (POST /requests/{rfc}/actions).
        # Vide = fonction masquée. À VÉRIFIER
        type_action_message: "%env(default::EASYVISTA_MESSAGE_ACTION_TYPE_ID)%"

        # Statuts EasyVista -> pastille affichée (expressions régulières, sans accents, testées dans l'ordre)
        statuts:
            ok: "clotur|termin|resolu|ferme|livre|annul|refus|rejet"
            wait: "attente|valid|approb|suspend"
            # tout le reste = « en cours »
