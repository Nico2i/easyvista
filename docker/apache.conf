<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/public

    <Directory /app/public>
        AllowOverride None
        Require all granted
        # Symfony : toute URL qui n'est pas un fichier existant est servie par index.php
        FallbackResource /index.php
    </Directory>

    # Les fichiers statiques n'ont pas besoin du routeur
    <Directory /app/public/css>
        FallbackResource disabled
    </Directory>
    <Directory /app/public/js>
        FallbackResource disabled
    </Directory>

    # SSO derrière un reverse proxy : le proxy authentifie l'agent et transmet X-Remote-User ;
    # régler alors CALIPSO_SSO_SERVER_VAR=HTTP_X_REMOTE_USER. Ne jamais exposer ce conteneur
    # directement aux postes dans ce cas (l'en-tête pourrait être forgé).

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
