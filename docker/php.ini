; Réglages PHP communs à Calipso
date.timezone = Europe/Paris
memory_limit = 256M
; Pièces jointes : 5 Mo maximum côté portail (config/calipso/portail.yaml)
upload_max_filesize = 8M
post_max_size = 10M
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
